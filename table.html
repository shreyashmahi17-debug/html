<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        table {
            border-collapse: collapse;
            text-align: center;
            width: 900px;
        }

        td {
            border: 2px solid black;
            height: 50px;
        }
    </style>
</head>

<body>
    <table>
        <tr bgcolor="#92D050">
            <td>Row 1</td>
            <td></td>
            <td colspan="2">ColumnSpan="2"</td>
            <td colspan="2">ColumnSpan="2"</td>
        </tr>

        <tr bgcolor="#FFE4C4">
            <td>Row 2</td>
            <td></td>

            <td rowspan="3" colspan="2">
                RowSpan="3"<br>
                ColumnSpan="2"
            </td>

            <td rowspan="5" colspan="2">
                RowSpan="5"
                ColumnSpan="2"
            </td>
        </tr>

        <tr>
            <th bgcolor="red">Row 3</th>
            <td bgcolor="red"></td>
        </tr>

        <tr>
            <th bgcolor="#FFC000">Row 4</th>
            <td bgcolor="#FFC000"></td>
        </tr>

        <tr>
            <th bgcolor="#00B0F0">Row 5</th>

            <td bgcolor="#FFC000" rowspan="4">
                RowSpan="4"
            </td>

            <td bgcolor="#00B0F0" colspan="2">
                ColumnSpan="2"
            </td>
        </tr>

        <tr>
            <th bgcolor="#ED7D31">Row 6</th>

            <td bgcolor="#D2691E" colspan="2">
                ColumnSpan="2"
            </td>
        </tr>

        <tr>
            <th bgcolor="#9DC3E6">Row 7</th>

            <td bgcolor="#9DC3E6"></td>

            <td bgcolor="#9DC3E6" colspan="2">
                ColumnSpan="2"
            </td>
        </tr>

        <tr>

            <td bgcolor="BFBFBF"></td>

            <td bgcolor="#BFBFBF" colspan="2">
                ColumnSpan="3"
            </td>

            <td bgcolor="BFBFBF"></td>
        </tr>

    </table>
</body>

</html>
